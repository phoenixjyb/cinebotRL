[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinebotrl"
version = "0.1.0"
description = "Mobile manipulator RL platform with Isaac Lab"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "CinebotRL Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Lower bounds match verified working versions (see requirements-lock.txt for exact pins).
    "torch>=2.7.0",
    "gymnasium>=1.2.0",
    "stable-baselines3>=2.5.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.usd", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

line-length = 100
target-version = ['py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
